services:
  - type: web
    name: odontoai-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: API_KEY
        sync: false
  - type: web
    name: odontoai-ui
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    plan: free
    envVars:
      - key: API
        value: https://odontoai-api.onrender.com
